name: C/C++ CI for build dltsh

on:
  push:
    branches: [ "master-x86-64" ]
  pull_request:
    branches: [ "master-x86-64" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install-dependencies
      run: sudo apt install nasm clang llvm lld qemu-system-x86 libncurses-dev rustc cargo -y

    - name: build-shell
      run: |
        if [ -d "bin" ]; then
            make
        else
            mkdir -p bin/
            make
        fi
      working-directory: ./code/shell
